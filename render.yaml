services:
  # ========================================================
  # 1. Backend Web Service (.NET 8 Web API - Docker)
  # ========================================================
  - type: web
    name: furnimatch-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore # Hoặc oregon, frankfurt
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        sync: false # Nhập chuỗi kết nối SQL Server (Azure SQL / Supabase / Neon / v.v.)
      - key: Jwt__Key
        generateValue: true
      - key: Jwt__Issuer
        value: FurniMatchApi
      - key: Jwt__Audience
        value: FurniMatchUsers
      - key: SePay__ApiToken
        sync: false
      - key: SePay__BankAccountId
        sync: false

  # ========================================================
  # 2. Frontend Client (React Vite - Free Static Site)
  # ========================================================
  - type: web
    name: furnimatch-client
    runtime: static
    rootDir: furnimatch-client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: furnimatch-api
          property: host
        value: https://${furnimatch-api.host}/api
